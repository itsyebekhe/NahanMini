<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل | Neobrutalism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    // تنظیم تم قبل از رندر صفحه جهت جلوگیری از پرش رنگ
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --primary: #FDC800;
      --secondary: #432DD7;
      --success: #16A34A;
      --warning: #D97706;
      --danger: #DC2626;
      --surface: #FBFBF9;
      --card-bg: #FFFFFF;
      --text: #1C293C;
      --text-muted: #64748B;
      --border: #1C293C;
      --input-bg: #FFFFFF;
      --dot-color: #1C293C;
      --radius-sm: 4px;
      --radius-md: 8px;
    }
    [data-theme="dark"] {
      --surface: #0E1015;
      --card-bg: #181B22;
      --text: #FBFBF9;
      --text-muted: #94A3B8;
      --border: #000000;
      --input-bg: #111319;
      --dot-color: #2D313E;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    body {
      background-color: var(--surface);
      background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    .theme-toggle {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 3px 3px 0px var(--border);
      padding: 8px 12px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
    }
    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 6px 6px 0px var(--border);
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
    }
    [data-theme="dark"] .card {
      outline: 1px solid #2B3040;
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--primary);
      color: #1C293C;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      box-shadow: 2px 2px 0px var(--border);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2.1875rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }
    p {
      font-size: 0.9375rem;
      margin-bottom: 24px;
      color: var(--text-muted);
    }
    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9375rem;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 3px 3px 0px var(--border);
      outline: none;
    }
    [data-theme="dark"] input[type="password"] {
      outline: 1px solid #2B3040;
    }
    input[type="password"]:focus {
      box-shadow: 4px 4px 0px var(--secondary);
      border-color: var(--secondary);
    }
    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      background: var(--primary);
      color: #1C293C;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 4px 4px 0px var(--border);
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 6px 6px 0px var(--border);
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border);
    }
    .btn:disabled {
      background: #64748B;
      cursor: not-allowed;
      transform: none;
      box-shadow: 2px 2px 0px var(--border);
    }
    .toast {
      margin-top: 16px;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      display: none;
      text-align: center;
      box-shadow: 2px 2px 0px var(--border);
    }
    .toast.error {
      display: block;
      background: #7F1D1D;
      color: #FECACA;
      border-color: var(--border);
    }
    .toast.success {
      display: block;
      background: #14532D;
      color: #BBF7D0;
      border-color: var(--border);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 حالت تاریک</button>

  <div class="card">
    <div class="badge">SECURE GATEWAY</div>
    <h1>ورود مدیر</h1>
    <p>برای پیکربندی پروکسی و اشتراک‌ها، رمز عبور را وارد کنید.</p>

    <form id="loginForm">
      <label for="password">رمز عبور سیستم:</label>
      <input type="password" id="password" required autofocus autocomplete="current-password" />
      <button type="submit" id="submitBtn" class="btn">احراز هویت و ورود ➔</button>
      <div id="toast" class="toast"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const toast = document.getElementById("toast");
    const themeBtn = document.getElementById("themeBtn");

    function updateThemeBtn() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeBtn.textContent = isDark ? '☀️ حالت روشن' : '🌙 حالت تاریک';
    }
    updateThemeBtn();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
      updateThemeBtn();
    }

    const apiLoginUrl = window.location.pathname.replace(/\/login$/, '/api/login');
    const dashUrl = window.location.pathname.replace(/\/login$/, '/dash');

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      toast.className = "toast";
      toast.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "در حال بررسی...";

      try {
        const res = await fetch(apiLoginUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordInput.value })
        });

        const data = await res.json();

        if (res.ok && data.موفقیت) {
          toast.className = "toast success";
          toast.textContent = "✓ ورود موفق! در حال انتقال...";
          if (data.توکن) {
            localStorage.setItem("admin_token", data.توکن);
          }
          setTimeout(() => {
            window.location.href = dashUrl;
          }, 600);
        } else {
          toast.className = "toast error";
          toast.textContent = "✕ " + (data.پیام || "رمز عبور نادرست است.");
          submitBtn.disabled = false;
          submitBtn.textContent = "احراز هویت و ورود ➔";
        }
      } catch (err) {
        toast.className = "toast error";
        toast.textContent = "✕ خطا در اتصال به سرور.";
        submitBtn.disabled = false;
        submitBtn.textContent = "احراز هویت و ورود ➔";
      }
    });
  </script>
</body>
</html>
