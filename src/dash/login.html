<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به مدیریت</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1e293b;
      padding: 35px 30px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 25px;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #94a3b8;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 22px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }
    .message.error {
      color: #f87171;
    }
    .message.success {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>ورود به پنل مدیریت</h2>
    <form id="loginForm">
      <label for="password">رمز عبور مدیریت:</label>
      <input type="password" id="password" required autocomplete="current-password" autofocus />
      <button type="submit" id="submitBtn">ورود</button>
      <div id="msg" class="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    // مسیرهای خودکار بر اساس مسیر فراخوانی شده
    const apiLoginUrl = window.location.pathname.replace(/\/login$/, '/api/login');
    const dashUrl = window.location.pathname.replace(/\/login$/, '/dash');

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "message";
      msg.textContent = "در حال اعتبارسنجی...";
      submitBtn.disabled = true;

      try {
        const res = await fetch(apiLoginUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: passwordInput.value })
        });

        const data = await res.json();

        if (res.ok && data.موفقیت) {
          msg.className = "message success";
          msg.textContent = "ورود موفقیت‌آمیز بود. در حال انتقال...";
          if (data.توکن) {
            localStorage.setItem("admin_token", data.توکن);
          }
          setTimeout(() => {
            window.location.href = dashUrl;
          }, 800);
        } else {
          msg.className = "message error";
          msg.textContent = data.پیام || "رمز عبور نادرست است.";
          submitBtn.disabled = false;
        }
      } catch (err) {
        msg.className = "message error";
        msg.textContent = "خطا در اتصال به سرور.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
