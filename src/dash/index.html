<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیریت پروکسی | Neobrutalism</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --primary: #FDC800;
      --secondary: #432DD7;
      --success: #16A34A;
      --warning: #D97706;
      --danger: #DC2626;
      --surface: #FBFBF9;
      --card-bg: #FFFFFF;
      --text: #1C293C;
      --text-muted: #64748B;
      --border: #1C293C;
      --input-bg: #FFFFFF;
      --dot-color: #1C293C;
      --radius-sm: 4px;
      --radius-md: 8px;
    }
    [data-theme="dark"] {
      --surface: #0E1015;
      --card-bg: #181B22;
      --text: #FBFBF9;
      --text-muted: #94A3B8;
      --border: #000000;
      --input-bg: #111319;
      --dot-color: #2D313E;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    body {
      background-color: var(--surface);
      background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
      background-size: 24px 24px;
      padding: 32px 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--border);
    }
    .header h1 {
      font-size: 2.1875rem;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 6px 6px 0px var(--border);
      padding: 24px;
      margin-bottom: 24px;
    }
    [data-theme="dark"] .card {
      outline: 1px solid #2B3040;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px dashed var(--border);
      padding-bottom: 12px;
    }
    .card-title {
      font-size: 1.3125rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--primary);
      color: #1C293C;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      box-shadow: 2px 2px 0px var(--border);
    }
    .badge-secondary {
      background: var(--secondary);
      color: #FFFFFF;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media(max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 3px 3px 0px var(--border);
      outline: none;
      margin-bottom: 16px;
    }
    [data-theme="dark"] input, [data-theme="dark"] textarea, [data-theme="dark"] select {
      outline: 1px solid #2B3040;
    }
    textarea {
      height: 110px;
      resize: vertical;
      line-height: 1.6;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--secondary);
      box-shadow: 4px 4px 0px var(--secondary);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 3px 3px 0px var(--border);
      cursor: pointer;
      background: var(--primary);
      color: #1C293C;
      transition: all 0.1s ease;
    }
    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--border);
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
    }
    [data-theme="dark"] .btn-secondary {
      outline: 1px solid #2B3040;
    }
    .btn-danger {
      background: var(--danger);
      color: #FFFFFF;
    }
    .sub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 3px 3px 0px var(--border);
      padding: 12px 16px;
      margin-bottom: 12px;
      gap: 12px;
    }
    [data-theme="dark"] .sub-item {
      outline: 1px solid #2B3040;
    }
    .sub-item span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      word-break: break-all;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 3px 3px 0px var(--border);
    }
    [data-theme="dark"] table {
      outline: 1px solid #2B3040;
    }
    th, td {
      padding: 12px;
      text-align: right;
      border-bottom: 2px solid var(--border);
      font-size: 0.875rem;
    }
    th {
      background: var(--surface);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .btn-save {
      width: 100%;
      padding: 16px;
      font-size: 1.125rem;
      background: var(--primary);
      color: #1C293C;
      margin-top: 16px;
      box-shadow: 5px 5px 0px var(--border);
    }
    .toast {
      margin-top: 16px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      text-align: center;
      display: none;
      box-shadow: 3px 3px 0px var(--border);
    }
    .toast.success {
      display: block;
      background: #14532D;
      color: #BBF7D0;
    }
    .toast.error {
      display: block;
      background: #7F1D1D;
      color: #FECACA;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <span class="badge">CONTROLLER</span>
        <h1>پنل مدیریت سرور</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">🌙 تم</button>
        <button class="btn btn-secondary" onclick="logout()">خروج ✕</button>
      </div>
    </div>

    <!-- لینک‌های اشتراک -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">لینک‌های اتصال کاربران</span>
        <span class="badge badge-secondary">SUBSCRIPTIONS</span>
      </div>
      <div id="subLinks">در حال بارگذاری لینک‌ها...</div>
    </div>

    <!-- پیکربندی هسته -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">تنظیمات هسته</span>
        <span class="badge">CORE CONFIG</span>
      </div>
      <div class="grid-2">
        <div>
          <label>مسیر اشتراک (SUB PATH)</label>
          <input type="text" id="subPath" />
        </div>
        <div>
          <label>شناسه تایید (UUID)</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="uuid" />
            <button class="btn btn-secondary" style="height:42px; padding:0 12px;" onclick="genUUID()">تولید</button>
          </div>
        </div>
      </div>
      <label>وب‌سایت استتار (FAKE WEB URL)</label>
      <input type="text" id="fakeWeb" placeholder="https://example.com" />
    </div>

    <!-- آی‌پی‌های چندگانه -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">مخزن آی‌پی‌های تمیز و پروکسی</span>
        <span class="badge">IP POOLS</span>
      </div>
      <div class="grid-2">
        <div>
          <label>آدرس‌های تمیز کلودفلر (CLEAN IPS - سطر به سطر)</label>
          <textarea id="cleanIps" placeholder="openai.com&#10;104.16.0.1"></textarea>
        </div>
        <div>
          <label>آی‌پی‌های پروکسی اتصال تی‌سی‌پی (PROXY IPS - سطر به سطر)</label>
          <textarea id="proxyIps" placeholder="proxyip.cmliussss.net&#10;1.2.3.4:443"></textarea>
        </div>
      </div>
    </div>

    <!-- نگاشت و دسته‌بندی نودها -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">جفت‌سازی و گروه‌بندی نودها</span>
        <button class="btn btn-secondary" onclick="autoPairNodes()">⚡ جفت‌سازی خودکار</button>
      </div>

      <div style="display:grid; grid-template-columns: 2fr 2fr 1.5fr 1.5fr auto; gap: 8px; align-items: end;">
        <div>
          <label>Clean IP</label>
          <select id="mapCleanIp" style="margin:0;"></select>
        </div>
        <div>
          <label>Proxy IP</label>
          <select id="mapProxyIp" style="margin:0;"></select>
        </div>
        <div>
          <label>نام گره</label>
          <input type="text" id="mapName" placeholder="نود ۱" style="margin:0;" />
        </div>
        <div>
          <label>گروه</label>
          <input type="text" id="mapGroup" placeholder="ایرانسل" style="margin:0;" />
        </div>
        <div>
          <button class="btn" onclick="addNodeMapping()">+ افزودن</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>نام گره</th>
            <th>گروه / اپراتور</th>
            <th>Clean IP</th>
            <th>Proxy IP</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="mappingTableBody"></tbody>
      </table>
    </div>

    <button class="btn btn-save" onclick="saveSettings()">ذخیره تمامی تغییرات 💾</button>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const apiPath = window.location.pathname.replace(/\/dash$/, '/api/settings');
    let mappedNodes = [];

    async function loadData() {
      try {
        const res = await fetch(apiPath);
        if (res.status === 401) {
          window.location.href = window.location.pathname.replace(/\/dash$/, '/login');
          return;
        }
        const data = await res.json();

        document.getElementById('subPath').value = data.مسیر_اشتراک || '';
        document.getElementById('fakeWeb').value = data.وب_سایت_استتار || '';
        document.getElementById('uuid').value = data.شناسه_تایید || '';
        document.getElementById('cleanIps').value = (data.آدرس_های_تمیز || []).join('\n');
        document.getElementById('proxyIps').value = (data.آی_پی_های_پروکسی || []).join('\n');
        mappedNodes = data.نگاشت_گره_ها || [];

        renderSubLinks(data.لینک_های_اشتراک);
        updateDropdowns();
        renderMappingTable();
      } catch (err) {
        showToast('خطا در بارگذاری اطلاعات.', 'error');
      }
    }

    function renderSubLinks(links) {
      if (!links) return;
      const container = document.getElementById('subLinks');
      container.innerHTML = `
        <div class="sub-item">
          <span><strong>V2RAY:</strong> ${links.وی۲ری}</span>
          <button class="btn btn-secondary" onclick="copyText('${links.وی۲ری}')">کپی</button>
        </div>
        <div class="sub-item">
          <span><strong>CLASH:</strong> ${links.کلش}</span>
          <button class="btn btn-secondary" onclick="copyText('${links.کلش}')">کپی</button>
        </div>
        <div class="sub-item">
          <span><strong>UNIVERSAL:</strong> ${links.عمومی}</span>
          <button class="btn btn-secondary" onclick="copyText('${links.عمومی}')">کپی</button>
        </div>
      `;
    }

    function updateDropdowns() {
      const cleanList = document.getElementById('cleanIps').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const proxyList = document.getElementById('proxyIps').value.split('\n').map(s=>s.trim()).filter(Boolean);

      const cleanSel = document.getElementById('mapCleanIp');
      const proxySel = document.getElementById('mapProxyIp');

      cleanSel.innerHTML = cleanList.map(ip => `<option value="${ip}">${ip}</option>`).join('');
      proxySel.innerHTML = proxyList.map(ip => `<option value="${ip}">${ip}</option>`).join('');
    }

    document.getElementById('cleanIps').addEventListener('input', updateDropdowns);
    document.getElementById('proxyIps').addEventListener('input', updateDropdowns);

    function renderMappingTable() {
      const tbody = document.getElementById('mappingTableBody');
      if (mappedNodes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:18px; font-family:'JetBrains Mono';">هیچ گره‌ای تنظیم نشده است.</td></tr>`;
        return;
      }
      tbody.innerHTML = mappedNodes.map((n, i) => `
        <tr>
          <td><strong>${n.name || '---'}</strong></td>
          <td><span class="badge">${n.group || 'عمومی'}</span></td>
          <td><code style="font-family:'JetBrains Mono';">${n.cleanIp}</code></td>
          <td><code style="font-family:'JetBrains Mono';">${n.proxyIp || '---'}</code></td>
          <td><button class="btn btn-danger" style="padding:4px 10px; font-size:0.75rem;" onclick="deleteNode(${i})">حذف</button></td>
        </tr>
      `).join('');
    }

    function addNodeMapping() {
      const cleanIp = document.getElementById('mapCleanIp').value;
      const proxyIp = document.getElementById('mapProxyIp').value;
      const name = document.getElementById('mapName').value || `نود-${mappedNodes.length + 1}`;
      const group = document.getElementById('mapGroup').value || 'عمومی';

      if (!cleanIp) return alert('آدرس تمیز نمی‌تواند خالی باشد.');

      mappedNodes.push({ cleanIp, proxyIp, name, group });
      document.getElementById('mapName').value = '';
      renderMappingTable();
    }

    function autoPairNodes() {
      const cleanList = document.getElementById('cleanIps').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const proxyList = document.getElementById('proxyIps').value.split('\n').map(s=>s.trim()).filter(Boolean);
      if (cleanList.length === 0) return alert('حداقل یک Clean IP مشخص کنید.');

      mappedNodes = cleanList.map((cleanIp, i) => ({
        cleanIp,
        proxyIp: proxyList[i % proxyList.length] || '',
        name: `نود-${i + 1}`,
        group: 'پیش‌فرض'
      }));
      renderMappingTable();
    }

    function deleteNode(i) {
      mappedNodes.splice(i, 1);
      renderMappingTable();
    }

    function genUUID() {
      document.getElementById('uuid').value = crypto.randomUUID();
    }

    async function saveSettings() {
      showToast('در حال ذخیره تنظیمات...', '');
      const body = {
        مسیر_اشتراک: document.getElementById('subPath').value.trim(),
        وب_سایت_استتار: document.getElementById('fakeWeb').value.trim(),
        شناسه_تایید: document.getElementById('uuid').value.trim(),
        آدرس_های_تمیز: document.getElementById('cleanIps').value.split('\n').map(s=>s.trim()).filter(Boolean),
        آی_پی_های_پروکسی: document.getElementById('proxyIps').value.split('\n').map(s=>s.trim()).filter(Boolean),
        نگاشت_گره_ها: mappedNodes
      };

      try {
        const res = await fetch(apiPath, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          showToast('✓ تنظیمات با موفقیت در دیتابیس D1 ذخیره شد!', 'success');
          loadData();
        } else {
          showToast('✕ خطا در ذخیره تنظیمات.', 'error');
        }
      } catch {
        showToast('✕ خطا در اتصال به سرور.', 'error');
      }
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt);
      showToast('✓ لینک اشتراک با موفقیت کپی شد!', 'success');
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = `toast ${type}`;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function updateThemeBtn() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('themeBtn').textContent = isDark ? '☀️ روشن' : '🌙 تاریک';
    }
    updateThemeBtn();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
      updateThemeBtn();
    }

    function logout() {
      document.cookie = "admin_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      localStorage.removeItem("admin_token");
      window.location.href = window.location.pathname.replace(/\/dash$/, '/login');
    }

    loadData();
  </script>
</body>
</html>
